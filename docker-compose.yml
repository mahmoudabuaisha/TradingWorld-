# Local infrastructure for TradingWorld.
#   docker compose up -d        → Postgres(Timescale) + Redis
#   docker compose --profile app up → also builds api + web images
services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: tw-db
    environment:
      POSTGRES_USER: tradingworld
      POSTGRES_PASSWORD: tradingworld
      POSTGRES_DB: tradingworld
    ports:
      - "5432:5432"
    volumes:
      - tw-db-data:/var/lib/postgresql/data
      - ./packages/db/prisma/sql/0001_timescale.sql:/docker-entrypoint-initdb.d/0001_timescale.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingworld"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tw-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - tw-redis-data:/data

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: tw-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tradingworld:tradingworld@db:5432/tradingworld?schema=public
      REDIS_URL: redis://redis:6379
      BACKUP_DIR: /backups
    volumes:
      # read-only: the admin sheet shows the backup job's status.json
      - tw-backups:/backups:ro
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # OPS-02: daily pg_dump at BACKUP_AT (UTC) + weekly restore drill into a scratch database (docs/13-backups.md).
  # Set BACKUP_AGE_RECIPIENTS and BACKUP_RCLONE_REMOTE (+ RCLONE_CONFIG_*) in .env for encryption and the offsite copy.
  backup:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: tw-backup
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tradingworld:tradingworld@db:5432/tradingworld?schema=public
      BACKUP_DIR: /backups
      # the drill decrypts, so it needs the age identity; mount it only where drills run (see docs/13)
      BACKUP_AGE_IDENTITY_FILE: /run/secrets/age-identity
    command: ["node", "apps/api/dist/tools/backup.js", "schedule"]
    volumes:
      - tw-backups:/backups
      - ./secrets/age-identity.txt:/run/secrets/age-identity:ro
    healthcheck:
      # unhealthy when the last backup is older than BACKUP_MAX_AGE_HOURS or the last drill failed or is overdue
      test: ["CMD", "node", "apps/api/dist/tools/backup.js", "status", "--check"]
      interval: 1h
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: tw-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  # OPS-01: optional monitoring stack (docs/14-observability.md). Bound to localhost; reach it through an SSH tunnel or a
  # reverse proxy with authentication. The API scrape needs secrets/metrics-token.txt = METRICS_TOKEN.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    container_name: tw-prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./secrets/metrics-token.txt:/etc/prometheus/metrics-token:ro
      - tw-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.0
    container_name: tw-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - tw-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

  # traces: set OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces in .env (Jaeger takes no OTLP metrics)
  jaeger:
    profiles: ["monitoring"]
    image: jaegertracing/all-in-one:1.62.0
    container_name: tw-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"

  # OPS-01b: the machine's CPU, memory, disk and network for the "TradingWorld · Server" dashboard
  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.9.1
    container_name: tw-node-exporter
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro

  ml:
    profiles: ["ml"]
    build:
      context: ./services/ml
    container_name: tw-ml
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  tw-db-data:
  tw-backups:
  tw-prometheus-data:
  tw-grafana-data:
  tw-redis-data:
