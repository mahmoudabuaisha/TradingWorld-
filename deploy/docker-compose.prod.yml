# DEPLOY-01 — production on one server (docs/15-deployment.md). Only Caddy is reachable from the internet (80/443):
# it terminates HTTPS for DOMAIN and serves the web app, with /api/* and /ws going to the API and /grafana to the
# dashboards (OPS-01b, docs/14). The database, backups, Prometheus, Jaeger and the node exporter never leave the
# internal network. Run it through deploy/tw (it passes the env file and project name).
name: tradingworld

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      # the folder, not the file: a mounted file keeps its old copy after git replaces it (deploy.sh reloads Caddy)
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

  db:
    # pinned: a restore needs the same TimescaleDB version as the dump (docs/13)
    image: timescale/timescaledb:2.30.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradingworld
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: tradingworld
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../packages/db/prisma/sql/0001_timescale.sql:/docker-entrypoint-initdb.d/0001_timescale.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingworld"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: tradingworld-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tradingworld:${POSTGRES_PASSWORD}@db:5432/tradingworld?schema=public
      CORS_ORIGIN: https://${DOMAIN}
      APP_URL: https://${DOMAIN}
      BACKUP_DIR: /backups
      GIT_SHA: ${IMAGE_TAG:-latest}
      # OPS-01b: traces to Jaeger (Prometheus scrapes the metrics); the admin sheet links the dashboards
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
      MONITORING_URL: https://${DOMAIN}/grafana/
    volumes:
      # read-only: the admin sheet shows the backup job's status.json
      - backups:/backups:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

  web:
    image: tradingworld-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        # empty = the browser calls /api and /ws on its own origin (Caddy routes them)
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  backup:
    # the API image carries pg_dump 16, age and rclone (OPS-02)
    image: tradingworld-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tradingworld:${POSTGRES_PASSWORD}@db:5432/tradingworld?schema=public
      BACKUP_DIR: /backups
      BACKUP_AGE_IDENTITY_FILE: /run/secrets/age-identity
    command: ["node", "apps/api/dist/tools/backup.js", "schedule"]
    volumes:
      - backups:/backups
      - ./secrets/age-identity.txt:/run/secrets/age-identity:ro
    healthcheck:
      test: ["CMD", "node", "apps/api/dist/tools/backup.js", "status", "--check"]
      interval: 1h
      start_period: 5m
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  # ── OPS-01b: monitoring (docs/14-observability.md) ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN in deploy/.env}
    # Prometheus reads the scrape token from a file: the config and rules are copied into the data volume at every
    # start with the token from deploy/.env beside them (deploy.sh restarts it when infra/monitoring changes)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /prometheus/config &&
        cp /etc/prometheus/tw/prometheus.yml /etc/prometheus/tw/alerts.yml /prometheus/config/ &&
        printf %s "$$METRICS_TOKEN" > /prometheus/config/metrics-token && chmod 600 /prometheus/config/metrics-token &&
        exec /bin/prometheus --config.file=/prometheus/config/prometheus.yml --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=30d --storage.tsdb.retention.size=4GB
    volumes:
      - ../infra/monitoring:/etc/prometheus/tw:ro
      - prometheus-data:/prometheus
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # sign in with the platform admin's email (or "admin"); the password is set on Grafana's first start only
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-${ADMIN_PASSWORD:-}}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tradingworld-api.json
    # never start a public Grafana on its default admin/admin: the first start needs a password from deploy/.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ] && [ ! -f /var/lib/grafana/grafana.db ]; then
        echo "set GRAFANA_ADMIN_PASSWORD (or ADMIN_PASSWORD) in deploy/.env" >&2; exit 1; fi;
        exec /run.sh
    volumes:
      - ../infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      - prometheus
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # in memory: the newest traces only, gone on restart (enough to follow a slow or failing request)
      MEMORY_MAX_TRACES: "20000"
    mem_limit: 768m

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 128m

volumes:
  db-data:
  backups:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
