# OPS-01b — the outside check of the live site. Every 10 minutes GitHub runs the read-only smoke test against it
# (deploy/smoke-test.sh: pages, API, WebSocket, HTTPS, Grafana, closed ports). It sees what the server cannot report about
# itself: the machine, Docker or Caddy down, DNS, the certificate. A failed run is emailed to the repository owner
# (GitHub → Settings → Notifications → Actions). Another domain: set the repository variable SITE_DOMAIN.
name: Uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime

jobs:
  site:
    name: Live site
    # forks have no site to watch
    if: github.repository == 'mahmoudabuaisha/TradingWorld-'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DOMAIN: ${{ vars.SITE_DOMAIN || 'trading.mediatechnologies.uk' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/smoke-test.sh
          sparse-checkout-cone-mode: false
      # a deploy restarts the API for a few seconds: a failure counts only if it is still there a minute later
      - name: Smoke test
        run: deploy/smoke-test.sh "$DOMAIN" || { echo "retrying in 60 s"; sleep 60; deploy/smoke-test.sh "$DOMAIN"; }
