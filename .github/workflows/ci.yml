name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  node:
    name: Format · Lint · Typecheck · Test · Build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradingworld_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # the backup tests use the real pg_dump/pg_restore (16, like the server), age and rclone
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16 age rclone
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build:packages
      - run: pnpm typecheck
      # after the packages build and Prisma generates: the type-aware rules need the real types of workspace imports
      - run: pnpm lint
      - run: pnpm test
        env:
          # the candle store, repository and backup tests run against real PostgreSQL (plain Postgres here; the
          # TimescaleDB path is exercised by the backup-drill job)
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tradingworld_test
      - run: pnpm --filter @tradingworld/api build
      - run: pnpm --filter @tradingworld/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_WS_URL: ws://localhost:4000/ws

  backup-drill:
    # OPS-02 end to end on the production database engine: TimescaleDB with a compressed hypertable chunk →
    # encrypted backup with an offsite copy → restore drill from the offsite copy → disaster restore into a new database
    name: Backup · restore drill on TimescaleDB
    runs-on: ubuntu-24.04
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: tradingworld
          POSTGRES_PASSWORD: tradingworld
          POSTGRES_DB: tradingworld
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tradingworld"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tradingworld:tradingworld@localhost:5432/tradingworld?schema=public
      PGPASSWORD: tradingworld
      CANDLE_STORE: timescale
      MARKET_DATA_PROVIDER: demo
      BACKUP_DIR: ${{ github.workspace }}/.backups/local
      BACKUP_RCLONE_REMOTE: ${{ github.workspace }}/.backups/offsite
      BACKUP_AGE_IDENTITY_FILE: ${{ github.workspace }}/.backups/identity.txt
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16 age rclone
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages && pnpm --filter @tradingworld/api build
      - name: Schema, data and a compressed chunk
        run: |
          psql -h localhost -U tradingworld -d tradingworld -v ON_ERROR_STOP=1 -f packages/db/prisma/sql/0001_timescale.sql
          pnpm --filter @tradingworld/db exec prisma migrate deploy
          node apps/api/dist/tools/backfill.js XAUUSD 3000
          psql -h localhost -U tradingworld -d tradingworld -v ON_ERROR_STOP=1 -c "SELECT compress_chunk(c) FROM show_chunks('market.candles') c ORDER BY 1 LIMIT 1"
      - name: Encrypted backup with an offsite copy
        run: |
          mkdir -p .backups && age-keygen -o .backups/identity.txt
          export BACKUP_AGE_RECIPIENTS=$(age-keygen -y .backups/identity.txt)
          node apps/api/dist/tools/backup.js run
          ls -l .backups/local .backups/offsite
      - name: Restore drill from the offsite copy
        run: node apps/api/dist/tools/backup.js drill && node apps/api/dist/tools/backup.js status --check
      - name: Disaster restore into a new database (local copy gone)
        run: |
          rm .backups/local/*.dump.age
          psql -h localhost -U tradingworld -d postgres -c "CREATE DATABASE tw_recovered"
          node apps/api/dist/tools/backup.js restore .backups/local/*.manifest.json --target postgresql://tradingworld:tradingworld@localhost:5432/tw_recovered
          psql -h localhost -U tradingworld -d tw_recovered -At -c "SELECT count(*) FROM market.candles" -c "SELECT count(*) FROM timescaledb_information.hypertables"

  deploy-stack:
    # DEPLOY-01: the production stack exactly as the server runs it. deploy.sh builds the images, starts Caddy, the
    # database, API, web app and backup job, and waits for the API to report this commit; then the smoke test checks
    # the site through Caddy (HTTPS, same-origin API, WebSocket, closed ports) and the backup job does a real drill.
    name: Deploy · production stack end to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: deploy/.env and keys, as setup.sh writes them
        run: |
          mkdir -p deploy/secrets
          age-keygen -o deploy/secrets/age-identity.txt 2>/dev/null
          cat > deploy/.env <<EOF
          DOMAIN=localhost
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          JWT_SECRET=$(openssl rand -hex 32)
          METRICS_TOKEN=$(openssl rand -hex 24)
          ADMIN_EMAIL=admin@example.test
          ADMIN_PASSWORD=ci-admin-password-123
          BACKUP_AGE_RECIPIENTS=$(age-keygen -y deploy/secrets/age-identity.txt)
          MARKET_DATA_PROVIDER=demo
          EOF
      - name: deploy.sh (build, start, wait for this commit)
        env:
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: deploy/deploy.sh --force
      - name: Smoke test through Caddy
        run: deploy/smoke-test.sh localhost
      - name: Accounts in production
        run: |
          B=https://localhost/api/v1
          login=$(curl -sk -X POST $B/auth/login -H 'content-type: application/json' -d '{"email":"admin@example.test","password":"ci-admin-password-123"}')
          echo "$login" | grep -q '"role":"admin"' || { echo "admin login failed: $login"; exit 1; }
          reg=$(curl -sk -X POST $B/auth/register -H 'content-type: application/json' -d '{"email":"first@visitor.test","password":"visitor-pass-1","displayName":"Visitor"}')
          echo "$reg" | grep -q '"role":"user"' || { echo "first registration must not be admin: $reg"; exit 1; }
          echo "admin from ADMIN_EMAIL, first visitor is a user"
      - name: Backup tools and a real drill inside the stack
        run: |
          deploy/tw exec -T backup sh -c 'pg_dump --version && age --version && rclone version | head -1'
          deploy/tw exec -T backup node apps/api/dist/tools/backup.js run
          deploy/tw exec -T backup node apps/api/dist/tools/backup.js drill --local
      - name: Logs on failure
        if: failure()
        run: deploy/tw logs --tail 100

  python:
    name: ML service · ruff · tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
