# OPS-01 — Prometheus for the docker-compose `monitoring` profile (docs/14-observability.md).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: tradingworld-api
    metrics_path: /metrics
    # the same value as METRICS_TOKEN in .env, kept in secrets/metrics-token.txt
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["api:4000"]
