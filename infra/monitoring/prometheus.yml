# OPS-01 — Prometheus for production (deploy/docker-compose.prod.yml) and the local `monitoring` profile
# (docs/14-observability.md). Paths are relative to this file: the rules and the token sit next to it.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: tradingworld-api
    metrics_path: /metrics
    # the same value as METRICS_TOKEN: written from deploy/.env at start in production, secrets/metrics-token.txt locally
    authorization:
      type: Bearer
      credentials_file: metrics-token
    static_configs:
      - targets: ["api:4000"]

  # OPS-01b: the server itself (CPU, memory, disk, network); production only
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
